<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Panther → Bike — previz</title>
<style>html,body{margin:0;height:100%;background:#070a12;overflow:hidden}canvas{display:block}
#slate{position:fixed;left:14px;bottom:12px;font:11px/1.4 ui-monospace,Menlo,monospace;
letter-spacing:.09em;color:rgba(255,255,255,.55);text-shadow:0 1px 3px #000;pointer-events:none}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}</script></head>
<body><div id="slate"></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ------------------------------------------------------------------ *
 * A black panther runs a Singapore street at dusk and becomes a
 * motorcycle. Primitives only, every pose a pure function of t.
 *
 * The two hard things here, and how they are handled:
 *  - GAIT. A rotary gallop driven by one phase variable, with each limb
 *    given a fixed offset. Legs are two-segment so knees can bend.
 *  - MORPH. The panther is not swapped for a bike. Every panther part
 *    is lerped toward a target transform that forms the bike, so the
 *    front paws converge into the front wheel and the spine becomes the
 *    frame. One continuous object throughout, which is the whole point.
 *
 * Colour coding: black form = panther and bike (same object), pale
 * spheres = pedestrian heads, magenta = supertree canopies.
 * ------------------------------------------------------------------ */
const P = new URLSearchParams(location.search);
const BARE = P.get('bare')==='1', CAPTURE = P.get('capture')==='1';
const V3=THREE.Vector3, clamp=THREE.MathUtils.clamp, lerp=THREE.MathUtils.lerp;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const eInOut=x=>-(Math.cos(Math.PI*x)-1)/2, eOut=x=>1-(1-x)**3;
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};

/* ------------------------------ timeline -------------------------- */
const T = { leap: 11.2, morph0: 11.55, morph1: 12.75, land: 13.05, end: 15.0 };
const SPEED = 15.5;                       // panther ground speed, units/s
const ROAD_W = 22;

/* ----------------------------- renderer --------------------------- */
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:CAPTURE});
renderer.setPixelRatio(CAPTURE?1:Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.25;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x121a2e);
scene.fog=new THREE.FogExp2(0x121a2e,0.0055);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.05,1200);

const std=o=>new THREE.MeshStandardMaterial({flatShading:true,...o});
const M={
  cat:  std({color:0x0e1015,roughness:0.42,metalness:0.35}),   // panther AND bike
  road: std({color:0x1a1d25,roughness:0.85,metalness:0.1}),
  paint:std({color:0xc8ceda,roughness:0.6}),
  kerb: std({color:0x3b414c,roughness:0.9}),
  skin: std({color:0xd8b38f,roughness:0.85}),
  tower:std({color:0x1d2740,roughness:0.9}),
  shop: null,
  glass:std({color:0x0a0d14,roughness:0.15,metalness:0.9}),
  rim:  std({color:0xb9c2cf,roughness:0.3,metalness:0.85}),
};
const neon=c=>new THREE.MeshBasicMaterial({color:c});

/* ------------------------------- city ----------------------------- */
{
  const rnd=mul(4820);
  const road=new THREE.Mesh(new THREE.BoxGeometry(ROAD_W,0.4,520),M.road);
  road.position.set(0,-0.2,-190); road.receiveShadow=true; scene.add(road);
  for(const s of [-1,1]){
    const k=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.5,520),M.kerb);
    k.position.set(s*(ROAD_W/2+1.2),0.1,-190); scene.add(k);
  }
  for(let z=10;z>-450;z-=14){
    const d=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.05,6),M.paint);
    d.position.set(0,0.03,z); scene.add(d);
  }
  // colourful shophouses close to the kerb, glass towers behind them
  const SHOP=[0xe8d5a8,0xd9a6a0,0xa9c4cf,0xe0b76a,0xbfd0a8,0xd8b3c8];
  for(let z=6;z>-430;z-=13){
    for(const s of [-1,1]){
      const h=7+rnd()*5, w=11+rnd()*4;
      const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,12),
        std({color:SHOP[(rnd()*SHOP.length)|0],roughness:0.9}));
      b.position.set(s*(ROAD_W/2+7+w/2),h/2,z); b.castShadow=true; scene.add(b);
      for(let i=0;i<3;i++){                                   // lit windows
        const win=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.9,0.2),neon(0xffd9a0));
        win.position.set(b.position.x-s*(w/2+0.1),2.5+i*2.6,z+(rnd()-0.5)*8);
        scene.add(win);
      }
      if(rnd()>0.55){                                          // tower behind
        const th=40+rnd()*90;
        const tw=new THREE.Mesh(new THREE.BoxGeometry(14+rnd()*10,th,14+rnd()*8),M.tower);
        tw.position.set(s*(ROAD_W/2+32+rnd()*22),th/2,z-6); scene.add(tw);
        for(let i=0;i<6;i++){
          const st=new THREE.Mesh(new THREE.BoxGeometry(0.5,3+rnd()*8,0.4),
            neon([0x18e0ff,0xff3ba0,0xffc24d][(rnd()*3)|0]));
          st.position.set(tw.position.x-s*8,10+rnd()*(th-16),z-6+7); scene.add(st);
        }
      }
    }
  }
  // Marina Bay Sands silhouette closing the far end of the street
  for(const x of [-16,0,16]){
    const t1=new THREE.Mesh(new THREE.BoxGeometry(9,120,16),M.tower);
    t1.position.set(x,60,-430); scene.add(t1);
  }
  const deck=new THREE.Mesh(new THREE.BoxGeometry(64,5,20),M.tower);
  deck.position.set(0,122,-430); scene.add(deck);
  // Supertrees
  for(const [x,z] of [[-46,-150],[52,-196],[-58,-248],[46,-300]]){
    const tr=new THREE.Mesh(new THREE.CylinderGeometry(1.1,2.2,34,8),std({color:0x22303a,roughness:1}));
    tr.position.set(x,17,z); scene.add(tr);
    const cap=new THREE.Mesh(new THREE.ConeGeometry(9,6,10),neon(0xd94fbf));
    cap.position.set(x,36,z); scene.add(cap);
  }
}

/* ---------------------------- pedestrians ------------------------- */
// They line the pavements and turn their heads to track the panther.
const PEDS=[];
{
  const rnd=mul(9911);
  const TOP=[0xcf5b52,0x4c7fd0,0xe0b24d,0x53b07a,0xd8d3c8,0x8a5fc0];
  for(let z=-4;z>-300;z-=4.6){
    for(const s of [-1,1]){
      if(rnd()>0.88) continue;
      const g=new THREE.Group();
      const body=new THREE.Mesh(new THREE.BoxGeometry(0.62,1.05,0.36),
        std({color:TOP[(rnd()*TOP.length)|0],roughness:0.85}));
      body.position.y=1.32; body.castShadow=true; g.add(body);
      const legs=new THREE.Mesh(new THREE.BoxGeometry(0.56,0.85,0.34),std({color:0x2a2f38,roughness:0.9}));
      legs.position.y=0.42; g.add(legs);
      const headPivot=new THREE.Group(); headPivot.position.y=2.05; g.add(headPivot);
      const head=new THREE.Mesh(new THREE.SphereGeometry(0.24,10,8),M.skin);
      head.castShadow=true; headPivot.add(head);
      g.position.set(s*(ROAD_W/2+1.8+rnd()*4.4), 0, z+(rnd()-0.5)*4);
      g.rotation.y = s>0 ? -Math.PI/2 : Math.PI/2;
      scene.add(g); PEDS.push({g,headPivot,base:g.rotation.y});
    }
  }
}

/* -------------------- the panther, and the bike ------------------- */
// One object. The bike is not a second model; it is these same parts
// driven to different transforms.
const CAT=new THREE.Group();
const seg=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m||M.cat);
const parts={};
{
  parts.chest = seg(1.5,1.35,2.0);   parts.chest.position.set(0,1.62,0.9);
  parts.hips  = seg(1.42,1.28,1.8);  parts.hips.position.set(0,1.62,-0.95);
  parts.spine = seg(1.15,0.95,1.5);  parts.spine.position.set(0,1.62,0);
  parts.neck  = seg(0.8,0.72,1.0);   parts.neck.position.set(0,1.9,1.9);
  parts.head  = seg(0.86,0.76,1.15); parts.head.position.set(0,2.0,2.65);
  parts.muzzle= seg(0.5,0.42,0.55);  parts.muzzle.position.set(0,1.86,3.3);
  for(const k of ['chest','hips','spine','neck','head','muzzle']){
    parts[k].castShadow=true; CAT.add(parts[k]);
  }
  // eyes read the direction of travel even in silhouette
  for(const s of [-1,1]){
    const e=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.1,0.08),neon(0xffe27a));
    e.position.set(s*0.24,2.12,3.15); CAT.add(e); parts['eye'+s]=e;
  }
  // four two-segment legs
  const LEGS=[];
  for(const [name,sx,sz] of [['FL',-1,1.55],['FR',1,1.55],['HL',-1,-1.5],['HR',1,-1.5]]){
    const hip=new THREE.Group(); hip.position.set(sx*0.62,1.42,sz);
    const upper=seg(0.34,1.05,0.38); upper.position.y=-0.52; upper.castShadow=true; hip.add(upper);
    const knee=new THREE.Group(); knee.position.y=-1.02; hip.add(knee);
    const lower=seg(0.28,0.95,0.32); lower.position.y=-0.47; lower.castShadow=true; knee.add(lower);
    const paw=seg(0.36,0.24,0.6); paw.position.set(0,-0.98,0.1); knee.add(paw);
    CAT.add(hip); LEGS.push({name,hip,knee,paw,sx,sz});
  }
  parts.LEGS=LEGS;
  // tail: a short chain that whips while running and becomes the tailpipe
  parts.tail=[];
  for(let i=0;i<5;i++){
    const t=seg(0.2-i*0.02,0.2-i*0.02,0.62); t.castShadow=true; CAT.add(t); parts.tail.push(t);
  }
  // the two wheels: absent while running, grown during the morph
  const wheelGeo=new THREE.CylinderGeometry(0.92,0.92,0.42,20);
  parts.wheelF=new THREE.Mesh(wheelGeo,M.cat); parts.wheelR=new THREE.Mesh(wheelGeo,M.cat);
  for(const w of [parts.wheelF,parts.wheelR]){ w.rotation.z=Math.PI/2; w.castShadow=true;
    w.scale.setScalar(0.001); CAT.add(w); }
  parts.discF=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.46,16),M.rim);
  parts.discR=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.46,16),M.rim);
  for(const d of [parts.discF,parts.discR]){ d.rotation.z=Math.PI/2; d.scale.setScalar(0.001); CAT.add(d); }
  parts.lamp=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.34,0.2),neon(0xfff0c8));
  parts.lamp.scale.setScalar(0.001); CAT.add(parts.lamp);
  scene.add(CAT);
}

/* ------------------------------ motion ---------------------------- */
function catPath(t){
  // constant run, then a leap: the morph happens at the top of the arc
  const z = 6 - SPEED*t;
  let y = 0, pitch = 0;
  if(t > T.leap){
    const u = clamp((t-T.leap)/(T.land-T.leap),0,1);
    y = Math.sin(u*Math.PI)*3.1;
    pitch = Math.cos(u*Math.PI)*0.30;
  }
  return { pos:new V3(0,y,z), pitch, airborne: t>T.leap && t<T.land };
}

function poseCat(t){
  const { pos, pitch, airborne } = catPath(t);
  CAT.position.copy(pos);
  CAT.rotation.set(pitch,0,0);

  const mo = smooth(T.morph0,T.morph1,t);      // 0 = panther, 1 = bike
  const cat = 1-mo;

  // --- rotary gallop --------------------------------------------------
  const ph = t*2.55;                            // stride phase
  const OFF = { FL:0.0, FR:0.12, HL:0.52, HR:0.64 };
  for(const L of parts.LEGS){
    const p = (ph + OFF[L.name])*Math.PI*2;
    const swing = Math.sin(p), lift = Math.max(0,Math.cos(p));
    // in the air the legs tuck; in the morph they fold away entirely
    const air = airborne ? 0.55 : 0;
    L.hip.rotation.x  = cat*( swing*0.85 - air*0.5 );
    L.knee.rotation.x = cat*( -0.35 - lift*0.95 - air*0.8 );
    L.hip.position.y  = lerp(1.42, 1.05, mo);
    // paws converge on the wheel centres as the morph runs
    const wheelZ = L.sz>0 ? 1.75 : -1.6;
    L.hip.position.z  = lerp(L.sz, wheelZ, mo);
    L.hip.position.x  = lerp(L.sx*0.62, L.sx*0.12, mo);
    L.paw.scale.setScalar(clamp(cat*1.0+0.001,0.001,1));
  }
  // --- spine: arches when running, flattens into a frame -------------
  const bob = Math.sin(ph*Math.PI*2)*0.09*cat;
  parts.chest.position.set(0, lerp(1.62+bob,1.30,mo), lerp(0.9,0.55,mo));
  parts.chest.scale.set(1, lerp(1,0.72,mo), lerp(1,1.5,mo));
  parts.hips.position.set(0, lerp(1.62-bob,1.22,mo), lerp(-0.95,-1.15,mo));
  parts.hips.scale.set(1, lerp(1,0.8,mo), lerp(1,1.2,mo));
  parts.spine.position.set(0, lerp(1.62+bob*0.4,1.05,mo), 0);
  parts.spine.scale.set(lerp(1,0.62,mo), lerp(1,0.5,mo), lerp(1,2.1,mo));
  // --- head folds down into the fairing ------------------------------
  const dip = Math.sin(ph*Math.PI*2+1.2)*0.06*cat;
  parts.neck.position.set(0, lerp(1.9+dip,1.28,mo), lerp(1.9,1.55,mo));
  parts.neck.scale.set(1,lerp(1,0.7,mo),1);
  parts.head.position.set(0, lerp(2.0+dip,1.34,mo), lerp(2.65,2.05,mo));
  parts.head.scale.set(lerp(1,0.85,mo), lerp(1,0.6,mo), lerp(1,1.15,mo));
  parts.muzzle.position.set(0, lerp(1.86+dip,1.12,mo), lerp(3.3,2.5,mo));
  parts.muzzle.scale.setScalar(lerp(1,0.7,mo));
  for(const s of [-1,1]) parts['eye'+s].scale.setScalar(clamp(cat,0.001,1));
  // --- tail whips, then straightens into the tailpipe ----------------
  parts.tail.forEach((tp,i)=>{
    const k=i+1, wave=Math.sin(ph*Math.PI*2 - k*0.55)*0.34*cat;
    tp.position.set(lerp(wave*k*0.22,0,mo),
                    lerp(1.75+Math.cos(ph*Math.PI*2-k*0.5)*0.1*cat, 1.05, mo),
                    lerp(-1.9-k*0.55, -1.95-k*0.16, mo));
    tp.scale.set(1,1,lerp(1,0.8,mo));
  });
  // --- wheels grow in exactly as the paws arrive ---------------------
  const wsc = clamp(mo*1.05,0.001,1);
  parts.wheelF.position.set(0,lerp(0.6,0.95,mo),1.75); parts.wheelF.scale.setScalar(wsc);
  parts.wheelR.position.set(0,lerp(0.6,0.95,mo),-1.6); parts.wheelR.scale.setScalar(wsc);
  parts.discF.position.copy(parts.wheelF.position); parts.discF.scale.setScalar(wsc);
  parts.discR.position.copy(parts.wheelR.position); parts.discR.scale.setScalar(wsc);
  const spin = -(6-pos.z)/0.92;
  parts.wheelF.rotation.set(spin,0,Math.PI/2); parts.wheelR.rotation.set(spin,0,Math.PI/2);
  parts.discF.rotation.set(spin,0,Math.PI/2); parts.discR.rotation.set(spin,0,Math.PI/2);
  parts.lamp.position.set(0,1.42,2.62); parts.lamp.scale.setScalar(clamp((mo-0.5)*2,0.001,1));
  return pos;
}

/* ---------- pedestrians track it as it goes past ------------------ */
function posePeds(t,catPos){
  for(const p of PEDS){
    const dz = p.g.position.z - catPos.z;
    const near = clamp(1 - Math.abs(dz)/34, 0, 1);
    const want = Math.atan2(catPos.x-p.g.position.x, catPos.z-p.g.position.z);
    // heads snap round to follow, and the whole body leans once it is close
    p.headPivot.rotation.y = (want - p.base) * near;
    p.g.rotation.y = p.base + (want-p.base)*near*0.32;
    p.g.position.y = near>0.55 ? Math.abs(Math.sin(t*7+p.g.position.z))*0.05 : 0;
  }
}

/* ------------------------------ lights ---------------------------- */
scene.add(new THREE.AmbientLight(0x3d4a6b,1.5));
scene.add(new THREE.HemisphereLight(0x4a5f92,0x14161d,1.2));
const key=new THREE.DirectionalLight(0xffd0a0,1.5); key.position.set(-30,40,-10);
key.castShadow=true; key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-40,right:40,top:40,bottom:-40,near:1,far:180});
key.shadow.bias=-0.0012; key.shadow.normalBias=0.04; scene.add(key);
// a hard rim is the only reason a black animal reads at all at dusk
const rim=new THREE.DirectionalLight(0x8fc2ff,3.2); rim.position.set(26,14,-40); scene.add(rim);
const rim2=new THREE.DirectionalLight(0xff9a5c,1.6); rim2.position.set(-24,9,26); scene.add(rim2);
const follow=new THREE.PointLight(0xbcd4ff,260,46,2); scene.add(follow);

/* --------------------------- post-process ------------------------- */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.5,0.7,0.78);
composer.addPass(bloom); composer.addPass(new OutputPass());

/* ------------------------------ shots ----------------------------- */
const shake=(t,a)=>new V3(Math.sin(t*39)*a,Math.sin(t*31+1.1)*a,Math.sin(t*26+2.2)*a);
function look(p,at){ camera.up.set(0,1,0); camera.position.copy(p); camera.lookAt(at); }
const SHOTS=[
 {name:'BURST PAST',end:2.0,fov:44,cam(u,t,c){
    look(new V3(5.6,1.15,-14).add(shake(t,0.05)), new V3(c.x,c.y+1.3,c.z)); }},
 {name:'THEY STARE',end:4.0,fov:38,cam(u,t,c){
    // from the road, across at the pavement crowd; the panther streaks
    // through the foreground and every head turns after it
    // panther crosses the foreground, crowd behind it, heads turning
    look(new V3(-7.5,1.95,c.z+15.5), new V3(9.0,1.70,c.z-1.5)); }},
 {name:'PAW LEVEL',end:5.8,fov:34,cam(u,t,c){
    look(new V3(c.x-7.8,0.62,c.z+2.4).add(shake(t,0.045)), new V3(c.x,1.0,c.z+0.4)); }},
 {name:'AERIAL',end:7.6,fov:42,cam(u,t,c){
    look(new V3(c.x+lerp(16,3,u),lerp(44,26,u),c.z+lerp(26,14,u)), new V3(c.x,1,c.z-4)); }},
 {name:'HERO PROFILE',end:9.4,fov:36,cam(u,t,c){
    look(new V3(c.x-12.5,2.0,c.z+0.6).add(shake(t,0.02)), new V3(c.x,1.6,c.z)); }},
 {name:'FACE',end:11.2,fov:30,cam(u,t,c){
    look(new V3(c.x-2.4,2.05,c.z+lerp(7.5,5.2,u)).add(shake(t,0.05)), new V3(c.x,1.95,c.z+2.4)); }},
 {name:'THE MORPH',end:13.05,fov:40,cam(u,t,c){
    // orbit the leap so the transformation is seen from the side and turning
    const a=lerp(-0.5,0.55,eInOut(u));
    look(new V3(c.x-Math.cos(a)*11,c.y+lerp(2.6,1.6,u),c.z+Math.sin(a)*11+1.5), new V3(c.x,c.y+1.2,c.z)); }},
 {name:'BIKE HERO',end:15.0,fov:34,cam(u,t,c){
    look(new V3(c.x-lerp(9,5.5,u),lerp(1.0,2.6,eOut(u)),c.z+lerp(7,11,u)).add(shake(t,0.02)),
         new V3(c.x,1.15,c.z)); }},
];
let acc=0; for(const s of SHOTS){ s.start=acc; acc=s.end; }
const TOTAL=SHOTS[SHOTS.length-1].end;

const slate=document.getElementById('slate');
function draw(t){
  const c=poseCat(t);
  posePeds(t,c);
  follow.position.set(c.x+6,c.y+7,c.z+5);
  const sh=SHOTS.find(s=>t<s.end)||SHOTS[SHOTS.length-1];
  const u=clamp((t-sh.start)/(sh.end-sh.start),0,1);
  camera.fov=sh.fov; camera.updateProjectionMatrix();
  sh.cam(u,t,c);
  if(!BARE) slate.textContent=`${t.toFixed(2)}s  ·  ${sh.name}`;
  composer.render();
}
const clock=new THREE.Clock(); let t=0,paused=false;
function frame(){requestAnimationFrame(frame);
  if(!paused) t=(t+Math.min(clock.getDelta(),0.05))%TOTAL; draw(t);}
requestAnimationFrame(frame);
addEventListener('keydown',e=>{
  if(e.code==='Space'){paused=!paused;e.preventDefault();}
  else if(e.code==='KeyR')t=0;
  else if(e.code==='ArrowRight')t=(t+0.25)%TOTAL;
  else if(e.code==='ArrowLeft')t=(t-0.25+TOTAL)%TOTAL;});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);bloom.setSize(innerWidth,innerHeight);});
if(BARE) slate.remove();
window.__anim={duration:TOTAL,shots:SHOTS.map(s=>({name:s.name,start:+s.start.toFixed(2),end:s.end})),
  seek(x){paused=true;t=clamp(x,0,TOTAL);draw(t);return{t,shot:(SHOTS.find(s=>t<s.end)||{}).name};},play(){paused=false;}};
</script></body></html>
