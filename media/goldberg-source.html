<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rube Goldberg — one-take previz</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c10;overflow:hidden}
  canvas{display:block}
  #slate{position:fixed;left:14px;bottom:12px;font:11px/1.4 ui-monospace,Menlo,monospace;
    letter-spacing:.09em;color:rgba(255,255,255,.55);text-shadow:0 1px 3px #000;pointer-events:none}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="slate"></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ------------------------------------------------------------------ *
 * A Rube Goldberg machine in ONE unbroken 15s take.
 *
 * The whole machine is laid out left to right along +X so a single
 * continuous dolly can carry the shot end to end without a cut. Every
 * stage is a pure function of t, and each one's trigger time is a named
 * constant — the causal chain has to be exact, so nothing here is
 * simulated or accumulated.
 *
 * Colour coding for the prompt that consumes this:
 *   red sphere = the marble        white boxes  = dominoes
 *   orange plank = seesaw          blue sphere  = pendulum ball
 *   green box = bucket             purple box   = counterweight
 *   cyan cylinder = turbine        magenta      = the flag it raises
 * ------------------------------------------------------------------ */
const P = new URLSearchParams(location.search);
const BARE = P.get('bare') === '1', CAPTURE = P.get('capture') === '1';
const V3 = THREE.Vector3;
const clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp;
const smooth = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const eIn = (x) => x*x, eOut = (x) => 1-(1-x)*(1-x), eInOut = (x) => -(Math.cos(Math.PI*x)-1)/2;
const seg = (t,a,b) => clamp((t-a)/(b-a),0,1);           // raw progress through a stage

/* --------------------------- the causal chain --------------------- */
// One number per event. Changing any of these re-times the whole machine.
const T = {
  release:  0.15,   // marble let go at the top of the chute
  seesaw:   2.30,   // marble lands on the high end of the seesaw
  offRamp:  3.35,   // marble rolls off the low end onto the rail
  domino:   4.05,   // marble strikes domino 1
  dominoEnd:6.05,   // last domino falls
  lever:    6.20,   // last domino trips the release lever
  swing:    6.45,   // pendulum let go
  strike:   7.75,   // pendulum hits the bucket
  bucket:   7.85,   // bucket starts falling
  counter:  9.60,   // counterweight has risen and tips the chute
  ball2:   10.35,   // yellow ball released down the tipped chute
  turbine: 11.90,   // ball hits the turbine
  flag:    13.35,   // turbine drive raises the flag
  end:     15.00,
};
const DOMINO_N = 14, DOM_X0 = 16.4, DOM_DX = 0.92;

/* ----------------------------- renderer --------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:CAPTURE });
renderer.setPixelRatio(CAPTURE ? 1 : Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1017);
scene.fog = new THREE.FogExp2(0x0d1017, 0.0075);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.02, 800);

const std = (o) => new THREE.MeshStandardMaterial({ flatShading:true, ...o });
const M = {
  wood:  std({ color:0x8a939f, roughness:0.85 }),
  dark:  std({ color:0x2b3038, roughness:0.9 }),
  rail:  std({ color:0xb9c2cf, roughness:0.4, metalness:0.6 }),
  marble:std({ color:0xe0242c, roughness:0.18, metalness:0.35 }),
  ball2: std({ color:0xf5c518, roughness:0.2, metalness:0.3 }),
  seesaw:std({ color:0xef7d20, roughness:0.7 }),
  domino:std({ color:0xeef1f6, roughness:0.6 }),
  pend:  std({ color:0x2d6cf0, roughness:0.2, metalness:0.5 }),
  bucket:std({ color:0x24a35a, roughness:0.65 }),
  weight:std({ color:0x8b46d6, roughness:0.6 }),
  turb:  std({ color:0x18cfe0, roughness:0.3, metalness:0.5 }),
  flag:  std({ color:0xff2d95, roughness:0.55, emissive:0x4a0028 }),
  post:  std({ color:0x4b535f, roughness:0.85 }),
};

/* --------------------------- room shell --------------------------- */
// The machine was reading as though it floated in a void; a back wall and
// floor give the shadows something to land on and the lens something to park
// against as it travels.
{
  const wall = new THREE.Mesh(new THREE.BoxGeometry(120, 40, 1), std({ color:0x1b2029, roughness:1 }));
  wall.position.set(30, 14, -11); wall.receiveShadow = true; scene.add(wall);
  const floor = new THREE.Mesh(new THREE.BoxGeometry(120, 1, 44), std({ color:0x161a22, roughness:1 }));
  floor.position.set(30, -6.5, 4); floor.receiveShadow = true; scene.add(floor);
}

/* ------------------------------ bench ----------------------------- */
{
  const bench = new THREE.Mesh(new THREE.BoxGeometry(72, 0.6, 14), M.dark);
  bench.position.set(30, -0.3, 0); bench.receiveShadow = true; scene.add(bench);
  for (let x = 2; x < 60; x += 11) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.7, 6, 0.7), M.post);
    leg.position.set(x, -3.4, -4.6); scene.add(leg);
  }
}

/* -------------------- stage 1: the spiral chute ------------------- */
const CHUTE = new THREE.CatmullRomCurve3([
  new V3(0.6, 7.4, -1.6), new V3(2.6, 6.3, 1.4), new V3(5.0, 4.9, -1.2),
  new V3(7.0, 3.4, 1.0),  new V3(8.6, 2.1, -0.3), new V3(9.9, 1.35, 0.0),
]);
{
  const pts = CHUTE.getSpacedPoints(64);
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i+1], mid = a.clone().lerp(b, 0.5);
    const floor = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.16, a.distanceTo(b)*1.25), M.wood);
    floor.position.copy(mid).add(new V3(0,-0.4,0));
    floor.lookAt(b.clone().add(new V3(0,-0.4,0))); floor.castShadow = true; scene.add(floor);
    for (const s of [-1,1]) {
      const r = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.5, a.distanceTo(b)*1.25), M.rail);
      r.position.copy(mid).add(new V3(0,-0.16,0));
      r.lookAt(b.clone().add(new V3(0,-0.16,0)));
      r.translateX(s*0.72); scene.add(r);
    }
  }
  const gate = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.9, 1.6), M.rail);
  gate.position.set(0.35, 7.7, -1.6); scene.add(gate);
}

/* ---------------------------- the marble -------------------------- */
const MARBLE = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 16), M.marble);
MARBLE.castShadow = true; scene.add(MARBLE);

/* -------------------- stage 2: seesaw on a fulcrum ---------------- */
const SEESAW = new THREE.Group();
{
  const plank = new THREE.Mesh(new THREE.BoxGeometry(7.2, 0.28, 1.7), M.seesaw);
  plank.castShadow = true; SEESAW.add(plank);
  for (const s of [-1,1]) {
    const lip = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 1.7), M.seesaw);
    lip.position.set(s*3.5, 0.34, 0); SEESAW.add(lip);
  }
  SEESAW.position.set(12.4, 1.5, 0); scene.add(SEESAW);
  const ful = new THREE.Mesh(new THREE.ConeGeometry(0.75, 1.5, 4), M.post);
  ful.position.set(12.4, 0.75, 0); ful.rotation.y = Math.PI/4; scene.add(ful);
}

/* ------------------------ stage 3: dominoes ----------------------- */
const DOMS = [];
for (let i = 0; i < DOMINO_N; i++) {
  const d = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.26, 1.5, 0.9), M.domino);
  b.position.y = 0.75; b.castShadow = true; d.add(b);
  d.position.set(DOM_X0 + i*DOM_DX, 0.0, 0);
  scene.add(d); DOMS.push(d);
}

/* ------------- stage 4: release lever and pendulum ---------------- */
const LEVER = new THREE.Group();
{
  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.22, 0.5), M.rail);
  arm.position.x = 0.95; LEVER.add(arm);
  LEVER.position.set(DOM_X0 + DOMINO_N*DOM_DX + 0.4, 1.15, 0); scene.add(LEVER);
}
const PEND = new THREE.Group();
const PEND_PIVOT = new V3(32.6, 7.2, 0);
{
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.4, 7.4, 0.4), M.post);
  post.position.set(32.6, 3.7, -1.1); scene.add(post);
  const bar = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.3, 0.3), M.post);
  bar.position.set(32.0, 7.3, -0.55); scene.add(bar);
  const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,4.6,6), M.rail);
  rope.position.y = -2.3; PEND.add(rope);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.72, 18, 14), M.pend);
  ball.position.y = -4.8; ball.castShadow = true; PEND.add(ball);
  PEND.position.copy(PEND_PIVOT); scene.add(PEND);
}

/* ------------- stage 5+6: bucket, pulley, counterweight ----------- */
const BUCKET = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.5, 1.6), M.bucket);
const WEIGHT = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 1.1), M.weight);
const ROPE_L = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,1,6), M.rail);
const ROPE_R = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,1,6), M.rail);
const PULLEY_TOP = new V3(40.6, 8.2, 0);
{
  BUCKET.castShadow = WEIGHT.castShadow = true;
  scene.add(BUCKET, WEIGHT, ROPE_L, ROPE_R);
  const mast = new THREE.Mesh(new THREE.BoxGeometry(0.45, 8.4, 0.45), M.post);
  mast.position.set(40.6, 4.2, -1.0); scene.add(mast);
  const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.75,0.75,0.3,18), M.rail);
  wheel.rotation.x = Math.PI/2; wheel.position.copy(PULLEY_TOP); scene.add(wheel);
}

/* --------------- stage 6b: the chute the weight tips -------------- */
const CHUTE2 = new THREE.Group();
{
  const plank = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.24, 1.5), M.wood);
  plank.position.x = 3.2; plank.castShadow = true; CHUTE2.add(plank);
  for (const s of [-1,1]) {
    const r = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.42, 0.12), M.rail);
    r.position.set(3.2, 0.3, s*0.7); CHUTE2.add(r);
  }
  CHUTE2.position.set(44.2, 3.4, 0); scene.add(CHUTE2);
  const prop = new THREE.Mesh(new THREE.BoxGeometry(0.4, 3.4, 0.4), M.post);
  prop.position.set(44.2, 1.7, -0.9); scene.add(prop);
}
const BALL2 = new THREE.Mesh(new THREE.SphereGeometry(0.44, 20, 16), M.ball2);
BALL2.castShadow = true; scene.add(BALL2);

/* ------------------------- stage 7: turbine ----------------------- */
const TURBINE = new THREE.Group();
{
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,0.7,14), M.turb);
  hub.rotation.z = Math.PI/2; TURBINE.add(hub);
  for (let i = 0; i < 8; i++) {
    const bl = new THREE.Mesh(new THREE.BoxGeometry(0.14, 2.5, 0.85), M.turb);
    bl.position.y = 1.25; bl.rotation.x = 0;
    const arm = new THREE.Group(); arm.add(bl); arm.rotation.x = i*Math.PI/4;
    TURBINE.add(arm);
  }
  TURBINE.position.set(51.6, 3.1, 0); scene.add(TURBINE);
  const stand = new THREE.Mesh(new THREE.BoxGeometry(0.5, 3.1, 0.5), M.post);
  stand.position.set(51.6, 1.55, -0.8); scene.add(stand);
}

/* --------------------- stage 8: the flag rises -------------------- */
const FLAG = new THREE.Group();
{
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,4.2,8), M.rail);
  pole.position.y = 2.1; FLAG.add(pole);
  const cloth = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.5, 0.08), M.flag);
  cloth.position.set(1.2, 3.5, 0); FLAG.add(cloth);
  FLAG.position.set(56.4, -3.4, 0); scene.add(FLAG);
  const box = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.6, 2.2), M.dark);
  box.position.set(56.4, 0.5, 0); scene.add(box);
}

/* ------------------------------ lights ---------------------------- */
scene.add(new THREE.AmbientLight(0x5b6caf, 1.0));
scene.add(new THREE.HemisphereLight(0x8fa6d8, 0x181c24, 1.5));
const key = new THREE.DirectionalLight(0xfff2e0, 2.6);
key.position.set(18, 26, 18); key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-46,right:46,top:34,bottom:-34,near:1,far:120});
key.shadow.bias=-0.0012; key.shadow.normalBias=0.03; scene.add(key);
const rim = new THREE.DirectionalLight(0x6ea8ff, 1.1); rim.position.set(-20,12,-24); scene.add(rim);
const practical = new THREE.PointLight(0xffd9a0, 200, 40, 2); practical.position.set(30,10,6); scene.add(practical);

/* --------------------------- post-process ------------------------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.3, 0.7, 0.88);
composer.addPass(bloom); composer.addPass(new OutputPass());

/* --------------------------- the machine -------------------------- */
const _v = new V3();
// Where the action is at time t — the camera target, and the spine of the shot.
function actionPoint(t) {
  if (t < T.seesaw)   return CHUTE.getPointAt(clamp(seg(t,T.release,T.seesaw),0,1));
  if (t < T.domino)   return _v.set(lerp(12.4, 15.6, seg(t,T.seesaw,T.domino)), 1.9, 0).clone();
  if (t < T.lever)    return _v.set(lerp(DOM_X0, DOM_X0+DOMINO_N*DOM_DX, seg(t,T.domino,T.dominoEnd)), 1.0, 0).clone();
  if (t < T.strike)   return _v.set(32.6, lerp(3.6, 2.6, seg(t,T.swing,T.strike)), 0).clone();
  if (t < T.counter)  return _v.set(lerp(37.2, 40.6, seg(t,T.bucket,T.counter)), lerp(5.2, 3.4, seg(t,T.bucket,T.counter)), 0).clone();
  if (t < T.turbine)  return _v.set(lerp(44.4, 51.0, seg(t,T.ball2,T.turbine)), lerp(3.6, 3.1, seg(t,T.ball2,T.turbine)), 0).clone();
  return _v.set(lerp(51.6, 56.4, seg(t,T.turbine,T.flag+0.8)), lerp(3.1, 3.4, seg(t,T.turbine,T.end)), 0).clone();
}

function machine(t) {
  // --- 1. marble down the chute
  const uChute = eIn(seg(t, T.release, T.seesaw));
  if (t < T.seesaw) {
    MARBLE.position.copy(CHUTE.getPointAt(clamp(uChute,0,1)));
  } else if (t < T.offRamp) {
    // rides the tipping plank from the high end to the low end
    const u = eIn(seg(t, T.seesaw, T.offRamp));
    const x = lerp(12.4-3.1, 12.4+3.1, u);
    const tilt = lerp(0.16, -0.16, smooth(T.seesaw, T.offRamp, t));
    MARBLE.position.set(x, 1.5 + Math.sin(tilt)*(x-12.4) + 0.55, 0);
  } else {
    // runs the rail into domino 1, then is hidden behind the falling line
    const u = eOut(seg(t, T.offRamp, T.domino));
    MARBLE.position.set(lerp(15.5, DOM_X0-0.5, u), 0.95, 0);
    if (t > T.domino + 0.35) MARBLE.position.y = -99;
  }
  MARBLE.rotation.z = -MARBLE.position.x * 2.2;

  // --- 2. seesaw tips once the marble lands on it
  SEESAW.rotation.z = lerp(0.16, -0.16, smooth(T.seesaw, T.offRamp, t));

  // --- 3. dominoes topple in strict order, one after the next
  const perDom = (T.dominoEnd - T.domino) / DOMINO_N;
  DOMS.forEach((d, i) => {
    const t0 = T.domino + i*perDom;
    d.rotation.z = -1.35 * smooth(t0, t0 + perDom*1.5, t);
  });

  // --- 4. last domino trips the lever, lever releases the pendulum
  LEVER.rotation.z = -0.9 * smooth(T.lever, T.lever + 0.25, t);
  const swung = smooth(T.swing, T.strike, t);
  // released from held, swings down and through; then decays
  const after = t > T.strike ? Math.sin((t - T.strike) * 6.5) * 0.35 * Math.exp(-(t - T.strike) * 1.1) : 0;
  PEND.rotation.z = lerp(1.15, -0.12, eInOut(swung)) + after;

  // --- 5+6. bucket falls, counterweight rises on the same rope
  const fall = smooth(T.bucket, T.counter, t);
  const by = lerp(5.2, 1.1, eIn(fall)), wy = lerp(1.0, 5.6, eIn(fall));
  BUCKET.position.set(38.9, by, 0);
  WEIGHT.position.set(42.3, wy, 0);
  const rope = (m, x, yTop, yBot) => {
    m.position.set(x, (yTop+yBot)/2, 0); m.scale.y = Math.max(0.01, yTop-yBot);
  };
  rope(ROPE_L, 38.9, PULLEY_TOP.y, by + 0.75);
  rope(ROPE_R, 42.3, PULLEY_TOP.y, wy + 0.55);

  // --- 6b. risen weight tips the chute, releasing the yellow ball
  CHUTE2.rotation.z = -0.34 * smooth(T.counter, T.ball2, t);
  if (t < T.ball2) {
    BALL2.position.set(44.9, 3.75, 0);
  } else if (t < T.turbine) {
    const u = eIn(seg(t, T.ball2, T.turbine));
    BALL2.position.set(lerp(44.9, 51.0, u), lerp(3.75, 3.3, u) - u*u*0.3, 0);
  } else {
    BALL2.position.y = -99;
  }
  BALL2.rotation.z = -BALL2.position.x * 2.0;

  // --- 7. turbine spins up on impact and coasts down
  const spin = smooth(T.turbine, T.turbine + 0.35, t);
  TURBINE.rotation.x = -spin * (t - T.turbine) * 9.0 - smooth(T.turbine,T.end,t)*2.0;

  // --- 8. the flag rises: the payoff
  FLAG.position.y = lerp(-3.4, 1.3, eOut(smooth(T.flag, T.flag + 1.25, t)));
}

/* ---------------------------- the camera -------------------------- */
// One continuous move. The lens rides the action point the whole way,
// with the offset breathing so it is not a flat sideways truck.
function placeCamera(t) {
  const a = actionPoint(t);
  const p = clamp(t / T.end, 0, 1);
  const dist = lerp(7.0, 9.5, Math.sin(p * Math.PI * 2.0) * 0.5 + 0.5);
  const height = lerp(1.1, 3.4, Math.sin(p * Math.PI * 1.3) * 0.5 + 0.5);
  // swing from slightly behind, through side-on, to slightly ahead
  const ang = lerp(-0.55, 0.5, eInOut(p));
  const eye = new V3(
    a.x - Math.sin(ang) * dist * 0.55,
    a.y + height,
    a.z + Math.cos(ang) * dist,
  );
  camera.fov = lerp(44, 34, smooth(T.turbine, T.end, t));
  camera.updateProjectionMatrix();
  camera.up.set(0,1,0); camera.position.copy(eye); camera.lookAt(a);
}

const slate = document.getElementById('slate');
function draw(t) {
  machine(t); placeCamera(t);
  if (!BARE) {
    const stage = Object.entries(T).filter(([,v]) => v <= t).pop();
    slate.textContent = `${t.toFixed(2)}s  ·  ${stage ? stage[0] : 'start'}`;
  }
  composer.render();
}
const clock = new THREE.Clock(); let t = 0, paused = false;
function frame(){ requestAnimationFrame(frame);
  if(!paused) t = (t + Math.min(clock.getDelta(),0.05)) % T.end; draw(t); }
requestAnimationFrame(frame);

addEventListener('keydown', e => {
  if(e.code==='Space'){paused=!paused;e.preventDefault();}
  else if(e.code==='KeyR') t=0;
  else if(e.code==='ArrowRight') t=(t+0.25)%T.end;
  else if(e.code==='ArrowLeft') t=(t-0.25+T.end)%T.end;
});
addEventListener('resize', () => {
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  bloom.setSize(innerWidth,innerHeight);
});
if (BARE) slate.remove();
window.__anim = { duration: T.end, events: T,
  seek(x){ paused=true; t=clamp(x,0,T.end); draw(t); return {t}; }, play(){paused=false;} };
</script>
</body>
</html>
